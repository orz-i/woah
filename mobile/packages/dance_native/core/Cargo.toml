[package]
name = "woah_privacy_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
