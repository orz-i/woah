[project]
name = "dance-anonymizer"
version = "0.1.0"
description = "AI Video Dance Anonymizer and Privacy Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics==8.3.82",
    "onnx==1.17.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=9.0.0",
    "onnxscript>=0.7.1",
    "onnxruntime>=1.24.3",
    "onnxslim>=0.1.96",
    "onnxconverter-common>=1.16.0",
    "hydra-core>=1.3.0",
    "opencv-python>=4.8.0",
    "moviepy>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.5",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
