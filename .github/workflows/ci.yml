name: Production CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Verify Python Tools
        run: |
          uv run python tools/evaluate_tracking.py
          uv run python tools/verify_video.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile/packages/dance_domain && flutter pub get
          cd ../dance_ui && flutter pub get
          cd ../dance_native && flutter pub get
          cd ../../app && flutter pub get

      - name: Run Flutter Tests
        run: |
          cd mobile/packages/dance_domain && flutter test
          cd ../dance_ui && flutter test
          cd ../dance_native && flutter test
          cd ../../app && flutter test

      - name: Setup Android Model Asset
        run: |
          uv run python tools/setup_models.py --android

      - name: Run Android Native Unit Tests
        run: |
          cd mobile/app/android
          chmod +x gradlew
          ./gradlew :dance_native:testDebugUnitTest

      - name: Build Android Debug APK
        run: |
          cd mobile/app/android
          ./gradlew :app:assembleDebug

