name: Production CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

# Ready PRs, protected-branch pushes, and manual dispatches always run both
# platforms. Draft iterations defer expensive gates; the required aggregator
# still runs and cannot report success for a deferred or cancelled gate.
concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.17'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          download-from-astral-mirror: false
          prune-cache: true

      - name: Install Python Dependencies (locked)
        run: |
          uv sync --locked

      - name: Test CI governance contracts
        run: uv run --locked python -m unittest discover -s tools/ci -p 'test_*.py' -v

      - name: Verify Python Tools
        run: |
          uv run --locked python -m unittest tools.privacy.test_observation_replay -v
          uv run --locked python tools/evaluate_tracking.py
          uv run --locked python tools/verify_video.py

      - name: Verify shared Rust privacy core
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.97.1 aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          python tools/rust/run.py check
          python tools/rust/run.py build
          python tools/rust/abi_smoke.py crates/frame-kernel/target/release/libframe_kernel.so
          python tools/rust/timeline_smoke.py crates/frame-kernel/target/release/libframe_kernel.so
          python tools/rust/audio_smoke.py crates/frame-kernel/target/release/libframe_kernel.so
          python tools/rust/instances_smoke.py crates/frame-kernel/target/release/libframe_kernel.so
          python tools/rust/follow_smoke.py crates/frame-kernel/target/release/libframe_kernel.so
          python tools/rust/association_smoke.py crates/frame-kernel/target/release/libframe_kernel.so
          python tools/rust/pixels_smoke.py crates/frame-kernel/target/release/libframe_kernel.so
          python tools/rust/box_filter_smoke.py crates/frame-kernel/target/release/libframe_kernel.so
          python tools/rust/selection_smoke.py crates/frame-kernel/target/release/libframe_kernel.so
          python tools/rust/association_score_smoke.py crates/frame-kernel/target/release/libframe_kernel.so
          python tools/rust/temporal_region_smoke.py crates/frame-kernel/target/release/libframe_kernel.so
          python tools/rust/projection_smoke.py crates/frame-kernel/target/release/libframe_kernel.so
          python tools/rust/verify_matrix.py

      - name: Verify Android namespace contract
        run: python tools/release/verify_android_namespace.py

      - name: Verify shared export media contract
        run: |
          python tools/release/verify_export_media_contract.py
          python -m unittest tools.release.test_verify_export_media_contract -q

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17.0.21+9'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile/packages/dance_domain && flutter pub get --enforce-lockfile --no-example
          cd ../dance_ui && flutter pub get --enforce-lockfile --no-example
          cd ../dance_native && flutter pub get --enforce-lockfile --no-example
          (cd example && flutter pub get --enforce-lockfile --no-example)
          cd ../../app && flutter pub get --enforce-lockfile --no-example

      - name: Verify fresh locked Dart resolution
        run: python tools/ci/check_dependency_locks.py --fresh-dart

      - name: Verify Pigeon generation and failure fixtures
        run: python tools/ci/pigeon_codegen.py --self-test

      - name: Check handwritten Dart formatting
        run: python tools/ci/check_dart_format.py

      - name: Analyze all Dart packages
        run: |
          for package in mobile/packages/dance_domain mobile/packages/dance_ui mobile/packages/dance_native mobile/app; do
            (cd "$package" && flutter analyze --no-pub)
          done

      - name: Run Flutter Tests
        run: |
          cd mobile/packages/dance_domain && flutter test --no-pub
          cd ../dance_ui && flutter test --no-pub
          cd ../dance_native && flutter test --no-pub
          cd ../../app && flutter test --no-pub

      - name: Verify LiteRT and Crop Clarity QA Contracts
        run: |
          python -m unittest tools.test_setup_models -v
          uv run --locked python -m unittest tools.test_crop_clarity_model_tools -v
          uv run --locked python -m unittest tools.diagnostics.test_crop_clarity_ab_report -v

      # SAM2 is unavailable and ONNX is obsolete. YOLO stays mandatory; the
      # crop-clarity prototype is staged only when a verified SHA contract exists.
      - name: Stage Android LiteRT assets
        run: |
          python tools/setup_models.py --android

      - name: Install pinned Rust JNI build tools
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Verify Android locks, native tests, Release Kotlin and lint
        working-directory: mobile/app/android
        env:
          WOAH_PRIVACY_FIXTURE_DIR: ${{ runner.temp }}/woah-privacy-fixtures
        run: |
          ./gradlew :app:verifyWoahDependencyLocks :dance_native:verifyWoahDependencyLocks \
            :dance_native:testDebugUnitTest :dance_native:compileReleaseKotlin \
            :dance_native:lintDebug :app:lintDebug

      - name: Verify synthetic diagnostic privacy consumer compatibility
        run: |
          python tools/ci/check_diagnostic_privacy_fixture.py \
            "${{ runner.temp }}/woah-privacy-fixtures/before.zip" \
            "${{ runner.temp }}/woah-privacy-fixtures/after.zip"

      - name: Build Android Debug APK
        run: |
          cd mobile/app
          flutter build apk --debug --no-pub

      - name: Reject dependency lock drift
        run: python tools/ci/check_dependency_locks.py --check-tracked

  ios:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/ios-cloud.yml

  required:
    name: governance / required
    if: ${{ always() }}
    needs: [validate-and-test, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Require every platform to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_DRAFT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: python3 tools/ci/check_required_jobs.py
