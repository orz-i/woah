name: Production CI

on:
  push:
    # The feature branch is intentionally not merged until native/release
    # acceptance. Run the *same* Production CI gates on push before a PR.
    branches: [ main, master, feat/crop-clarity-phase2-quality-performance ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Windows-only host QA test gate. These stdlib/mocked tests exercise path,
  # signing-preflight and ADB-collector contracts without SDKs, passwords,
  # real media, private keys or a connected phone. This is NOT Release acceptance.
  windows-release-qa-host-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Windows Release QA host scripts (synthetic only)
        shell: pwsh
        run: |
          python -m unittest tools.diagnostics.test_release_apk_preflight tools.diagnostics.test_run_crop_clarity_release_qa tools.diagnostics.test_capture_crop_clarity_release_perf tools.diagnostics.test_crop_clarity_release_perf -q

  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python Dependencies (locked)
        run: |
          uv sync --locked

      - name: Verify Python Tools
        run: |
          uv run python tools/evaluate_tracking.py
          uv run python tools/verify_video.py

      - name: Verify Android namespace contract
        run: python tools/release/verify_android_namespace.py

      - name: Verify shared export media contract
        run: python tools/release/verify_export_media_contract.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile/packages/dance_domain && flutter pub get
          cd ../dance_ui && flutter pub get
          cd ../dance_native && flutter pub get
          cd ../../app && flutter pub get

      - name: Run Flutter Tests
        run: |
          cd mobile/packages/dance_domain && flutter test
          cd ../dance_ui && flutter test
          cd ../dance_native && flutter test
          cd ../../app && flutter test

      - name: Verify LiteRT Crop Clarity and Privacy Contracts
        run: |
          python -m unittest tools.test_setup_models -v
          uv run python -m unittest tools.test_crop_clarity_model_tools -v
          python -m unittest tools.test_crop_clarity_post_crop_contract -v
          python -m unittest tools.test_crop_clarity_synthetic_privacy -v
          python -m unittest tools.test_follow_camera_recovery_contract -v
          python -m unittest tools.test_kalman_process_noise_contract -v
          python -m unittest tools.test_kalman_lost_coasting_contract -v
          python -m unittest tools.test_privacy_coverage_contract -v
          python -m unittest tools.release.test_verify_export_media_contract -v
          python -m unittest discover -s tools/diagnostics -p 'test_*.py' -v

      # SAM2 is unavailable and ONNX is obsolete. YOLO stays mandatory; the
      # crop-clarity prototype is staged only when a verified SHA contract exists.
      - name: Stage Android LiteRT assets
        run: |
          python tools/setup_models.py --android

      - name: Run Android Native Unit Tests
        run: |
          cd mobile/app/android
          chmod +x gradlew
          ./gradlew :dance_native:testDebugUnitTest

      # Compile the native Kotlin that ships in the Release variant, not just
      # the Debug unit-test variant. The library compile task does not require
      # a release keystore, package an APK, run R8 or attest release behavior.
      # Actual signed Release builds and device OFF/ON exports remain blocked
      # until separately measured with the dedicated Release QA collector.
      - name: Compile Native Android Release Kotlin
        run: |
          cd mobile/app/android
          ./gradlew :dance_native:compileReleaseKotlin

      # Compiles the optional public-model Stage 3 synthetic smoke against
      # the *actual pinned* tasks-vision:1.0.0 Java/Kotlin ABI. It is not
      # executed in CI, downloads no .task weights and changes no export path.
      - name: Compile Android Instrumentation ABI Smoke
        run: |
          cd mobile/app/android
          ./gradlew :dance_native:compileDebugAndroidTestKotlin

      - name: Build Android Debug APK
        run: |
          cd mobile/app
          flutter build apk --debug

