name: Production CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

# Deliberately run both platforms for every PR, including documentation-only
# changes. This avoids an untested path classifier silently skipping a gate.
concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.17'

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.6"

      - name: Install Python Dependencies (locked)
        run: |
          uv sync --locked

      - name: Test CI governance contracts
        run: uv run --locked python -m unittest discover -s tools/ci -p 'test_*.py' -v

      - name: Verify Python Tools
        run: |
          uv run --locked python tools/evaluate_tracking.py
          uv run --locked python tools/verify_video.py

      - name: Verify Android namespace contract
        run: python tools/release/verify_android_namespace.py

      - name: Verify shared export media contract
        run: |
          python tools/release/verify_export_media_contract.py
          python -m unittest tools.release.test_verify_export_media_contract -q

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17.0.21+9'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile/packages/dance_domain && flutter pub get --enforce-lockfile --no-example
          cd ../dance_ui && flutter pub get --enforce-lockfile --no-example
          cd ../dance_native && flutter pub get --enforce-lockfile --no-example
          cd ../../app && flutter pub get --enforce-lockfile --no-example

      - name: Verify fresh locked Dart resolution
        run: python tools/ci/check_dependency_locks.py --fresh-dart

      - name: Check handwritten Dart formatting
        run: python tools/ci/check_dart_format.py

      - name: Analyze all Dart packages
        run: |
          for package in mobile/packages/dance_domain mobile/packages/dance_ui mobile/packages/dance_native mobile/app; do
            (cd "$package" && flutter analyze --no-pub)
          done

      - name: Run Flutter Tests
        run: |
          cd mobile/packages/dance_domain && flutter test --no-pub
          cd ../dance_ui && flutter test --no-pub
          cd ../dance_native && flutter test --no-pub
          cd ../../app && flutter test --no-pub

      - name: Verify LiteRT and Crop Clarity QA Contracts
        run: |
          python -m unittest tools.test_setup_models -v
          uv run --locked python -m unittest tools.test_crop_clarity_model_tools -v
          uv run --locked python -m unittest tools.diagnostics.test_crop_clarity_ab_report -v

      # SAM2 is unavailable and ONNX is obsolete. YOLO stays mandatory; the
      # crop-clarity prototype is staged only when a verified SHA contract exists.
      - name: Stage Android LiteRT assets
        run: |
          python tools/setup_models.py --android

      - name: Verify locked Android resolution
        working-directory: mobile/app/android
        run: ./gradlew :app:verifyWoahDependencyLocks :dance_native:verifyWoahDependencyLocks

      - name: Run Android Native Unit Tests
        env:
          WOAH_PRIVACY_FIXTURE_DIR: ${{ runner.temp }}/woah-privacy-fixtures
        run: |
          cd mobile/app/android
          chmod +x gradlew
          ./gradlew :dance_native:testDebugUnitTest

      - name: Verify synthetic diagnostic privacy consumer compatibility
        run: |
          python tools/ci/check_diagnostic_privacy_fixture.py \
            "${{ runner.temp }}/woah-privacy-fixtures/before.zip" \
            "${{ runner.temp }}/woah-privacy-fixtures/after.zip"

      # Compile the native Release variant without requiring any signing key.
      # This checks the safety backport's Release ABI, not publishable APK
      # signing, R8, device rendering or visual privacy acceptance.
      - name: Compile Native Android Release Kotlin
        run: |
          cd mobile/app/android
          ./gradlew :dance_native:compileReleaseKotlin

      - name: Run Android Lint
        working-directory: mobile/app/android
        run: ./gradlew :dance_native:lintDebug :app:lintDebug

      - name: Build Android Debug APK
        run: |
          cd mobile/app
          flutter build apk --debug

      - name: Reject dependency lock drift
        run: python tools/ci/check_dependency_locks.py --check-tracked

  ios:
    uses: ./.github/workflows/ios-cloud.yml

  required:
    name: governance / required
    if: ${{ always() }}
    needs: [validate-and-test, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every platform to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci/check_required_jobs.py
