name: iOS Cloud CI

on:
  # Production CI calls this exact revision once per push/PR. Keeping the
  # workflow independently dispatchable supports targeted Apple diagnostics.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-cloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: Xcode 26 / no-codesign build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'

      - name: Set up Flutter 3.44.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - name: Print Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          pod --version
          flutter --version

      - name: Verify repository iOS contracts
        run: |
          python tools/release/verify_export_media_contract.py
          python -m unittest tools.release.test_verify_export_media_contract -q
          python tools/release/verify_ios_phase0.py
          python tools/release/verify_ios_phase1.py
          # Explicitly verify the supported protagonist leg-stretch contract.
          python tools/release/verify_ios_phase4.py
          python -m unittest tools.release.test_verify_ios_phase4 -q

      # Strongest Apple-only lane: model provisioning, both Metal SDKs,
      # simulator build and Phase 6 runtime smoke. Do not replace with static checks.
      - name: Run full iOS Phase 6 gate
        run: python tools/ios/run_phase6_macos_gate.py

      - name: Resolve Flutter and native dependencies
        working-directory: mobile/app
        run: |
          flutter config --enable-swift-package-manager
          python ../../tools/ci/resolve_ios_dependencies.py

      - name: Build production entrypoint for iPhoneOS
        working-directory: mobile/app
        run: |
          flutter build ios --debug --no-codesign --target lib/main.dart

      - name: Reject dependency lock drift
        run: python tools/ci/check_dependency_locks.py --check-tracked

      - name: Archive no-codesign app
        working-directory: mobile/app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            artifacts/Woah-ios-debug-app.zip

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: woah-ios-debug-${{ github.sha }}
          path: mobile/app/artifacts/Woah-ios-debug-app.zip
          if-no-files-found: error
          retention-days: 14
